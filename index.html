<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beauty Product Inventory Manager</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-center py-8 shadow-lg">
        <h1 class="text-3xl md:text-4xl font-bold">
            Beauty Product Inventory Manager
        </h1>

        <p class="mt-2 text-pink-100">
            Manage your beauty products easily
        </p>
    </header>

    <main class="w-[90%] max-w-6xl mx-auto py-8">

        <!-- Add Product -->
        <section class="bg-white rounded-2xl shadow-md p-6 mb-8">

            <h2 class="text-2xl font-bold text-purple-700 mb-6">
                Add New Product
            </h2>

            <form id="productForm"
                  class="grid grid-cols-1 md:grid-cols-2 gap-5">

                <div>
                    <label for="productName"
                           class="block font-semibold mb-2">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="e.g. Lipstick"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-400"
                    >
                </div>

                <div>
                    <label for="category"
                           class="block font-semibold mb-2">
                        Category
                    </label>

                    <select
                        id="category"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-400">

                        <option value="">Select Category</option>
                        <option value="Makeup">Makeup</option>
                        <option value="Skincare">Skincare</option>
                        <option value="Hair Care">Hair Care</option>
                        <option value="Fragrance">Fragrance</option>

                    </select>
                </div>

                <div>
                    <label for="price"
                           class="block font-semibold mb-2">
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        id="price"
                        min="1"
                        placeholder="Enter price"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-400"
                    >
                </div>

                <div>
                    <label for="quantity"
                           class="block font-semibold mb-2">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        min="0"
                        placeholder="Enter quantity"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-400"
                    >
                </div>

                <button
                    type="submit"
                    class="md:col-span-2 bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-lg transition">

                    Add Product

                </button>

            </form>
        </section>


        <!-- Product Inventory -->
        <section class="bg-white rounded-2xl shadow-md p-6 mb-8 overflow-x-auto">

            <h2 class="text-2xl font-bold text-purple-700 mb-6">
                Product Inventory
            </h2>

            <table class="w-full text-center">

                <thead class="bg-pink-100 text-purple-800">

                    <tr>
                        <th class="p-3">Product</th>
                        <th class="p-3">Category</th>
                        <th class="p-3">Price</th>
                        <th class="p-3">Quantity</th>
                        <th class="p-3">Action</th>
                    </tr>

                </thead>

                <tbody
                    id="productTableBody"
                    class="divide-y divide-gray-200">

                    <!-- Products added using TypeScript -->

                </tbody>

            </table>
        </section>


        <!-- Inventory Summary -->
        <section class="bg-white rounded-2xl shadow-md p-6">

            <h2 class="text-2xl font-bold text-purple-700 mb-6">
                Inventory Summary
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

                <div class="bg-pink-100 rounded-xl p-6 text-center">
                    <h3 class="font-semibold text-purple-700">
                        Total Products
                    </h3>

                    <p id="totalProducts"
                       class="text-3xl font-bold mt-2">
                        0
                    </p>
                </div>


                <div class="bg-purple-100 rounded-xl p-6 text-center">

                    <h3 class="font-semibold text-purple-700">
                        Total Stock
                    </h3>

                    <p id="totalStock"
                       class="text-3xl font-bold mt-2">
                        0
                    </p>

                </div>


                <div class="bg-pink-100 rounded-xl p-6 text-center">

                    <h3 class="font-semibold text-purple-700">
                        Inventory Value
                    </h3>

                    <p id="inventoryValue"
                       class="text-3xl font-bold mt-2">
                        ₹0
                    </p>

                </div>

            </div>

        </section>

    </main>


    <footer class="bg-purple-700 text-white text-center py-5 mt-8">

        <p>Beauty Product Inventory Manager</p>

    </footer>


    <!-- Compiled TypeScript -->
    <script src="dist/app.js"></script>

</body>
</html>
